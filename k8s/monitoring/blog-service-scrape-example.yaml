# Example: annotate your blog-service Deployment so Prometheus discovers it via kubernetes_sd.
# Apply alongside your existing blog-service manifest (adjust namespace/labels as needed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-service
  namespace: default
  labels:
    app: blog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-service
  template:
    metadata:
      labels:
        app: blog-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: blog-service
          image: your-registry/blog-service:latest
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: blog-service
  namespace: default
  labels:
    app: blog-service
spec:
  selector:
    app: blog-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
